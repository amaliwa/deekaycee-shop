name: Deploy to reseller hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftps
          server: ${{ secrets.DEPLOY_FTPS_HOST }}
          username: ${{ secrets.DEPLOY_FTPS_USERNAME }}
          password: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
          port: ${{ vars.DEPLOY_FTPS_PORT || 21 }}
          server-dir: ${{ vars.DEPLOY_FTPS_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.vscode/**
            **/.env*
            **/README.md
